name: Zeouf Local Integration
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  integrated-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Read the reviewed project revision
        id: project
        run: node scripts/ecommerce-project.js
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.project.outputs.website_repository }}
          ref: ${{ steps.project.outputs.website_revision }}
          path: website-source
          persist-credentials: false
      - name: Test disposable Auth, database, storage, concurrency and test inbox
        run: npm run test:ecommerce:integration -- website-source test-results/local-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeouf-local-integration
          path: test-results/local-integration/
          retention-days: 30
