name: Deploy Playwright Report

on:
  workflow_run:
    workflows: [Playwright Tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed default-branch Playwright Tests run at the current commit
        type: string
        required: true

permissions:
  contents: write
  pages: write
  actions: read

concurrency:
  group: zeouf-report-publication
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == github.event.repository.default_branch && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate the authoritative source run
        id: source
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.REQUESTED_RUN)) throw new Error('Invalid run ID');
            const fs = require('node:fs');
            const { validateOrigin } = require('./scripts/ci-report-origin');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(process.env.REQUESTED_RUN) });
            const branch = context.payload.repository.default_branch;
            const { data: head } = await github.rest.repos.getBranch({ ...context.repo, branch });
            const metadata = validateOrigin(run, `${context.repo.owner}/${context.repo.repo}`, branch, head.commit.sha);
            fs.writeFileSync('source-run.json', JSON.stringify(metadata, null, 2));
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: run.id });
            core.setOutput('run_id', run.id);
            core.setOutput('html', data.artifacts.some(a => a.name === 'playwright-report' && !a.expired));
            core.setOutput('results', data.artifacts.some(a => a.name === 'playwright-test-results' && !a.expired));
            await core.summary.addHeading('Report publication').addRaw(`Original test conclusion: ${run.conclusion}. Source run: ${run.html_url}. Publication does not change the test result.`).write();
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.html == 'true'
        with:
          name: playwright-report
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: downloaded/playwright-report
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.results == 'true'
        with:
          name: playwright-test-results
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: downloaded/test-results
      - name: Build evidence index without rerunning tests
        run: node scripts/build-ci-report-site.js source-run.json downloaded report-site
      - name: Publish the original reports
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: report-site
          publish_branch: gh-pages
