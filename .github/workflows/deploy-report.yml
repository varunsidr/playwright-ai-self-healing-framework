name: Deploy Playwright Report

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (generate report)
        run: npx playwright test --reporter=html
        continue-on-error: true

      - name: Ensure HTML report exists (fallback)
        run: |
          if [ ! -d "playwright-report" ] || [ -z "$(ls -A playwright-report 2>/dev/null)" ]; then
            echo "No report generated by Playwright; creating placeholder report."
            mkdir -p playwright-report
            printf '%s\n' '<!doctype html>' '<html><head><meta charset="utf-8"><title>No Report</title></head>' '<body><h1>No Playwright HTML report generated</h1><p>Either tests failed to run or the reporter did not create output.</p></body></html>' > playwright-report/index.html
          else
            echo "Found playwright-report contents:" && ls -la playwright-report | sed -n '1,20p'
          fi

      - name: Deploy report to GitHub Pages
        if: ${{ always() }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          publish_branch: gh-pages
