name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run demo UI and API tests
        run: npx playwright test --project=api --project=chromium --project=firefox --project=webkit
      - name: Run ecommerce tests when a test URL is configured
        if: ${{ vars.ECOMMERCE_BASE_URL != '' }}
        env:
          ECOMMERCE_BASE_URL: ${{ vars.ECOMMERCE_BASE_URL }}
        run: npx playwright test --project=ecommerce-chromium --reporter=list
      - name: Summarize test stability
        if: always()
        run: npm run summarize:results -- test-results/playwright-results.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
