name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    env:
      ECOMMERCE_BUILD_REVISION: ${{ vars.ECOMMERCE_BUILD_REVISION }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run demo UI and API tests
        env:
          PW_OUTPUT_DIR: test-results/demo
          PW_HTML_REPORT_DIR: playwright-report/demo
          PW_JUNIT_REPORT_PATH: test-results/demo-junit.xml
          PW_JSON_REPORT_PATH: test-results/demo-results.json
        run: npx playwright test --project=api --project=chromium --project=firefox --project=webkit
      - name: Summarize demo test stability
        if: always()
        run: npm run summarize:results -- test-results/demo-results.json
      - name: Run deployed Zeouf read-only smoke checks
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' }}
        env:
          ECOMMERCE_BASE_URL: ${{ vars.ECOMMERCE_BASE_URL }}
          PW_OUTPUT_DIR: test-results/ecommerce
          PW_HTML_REPORT_DIR: playwright-report/ecommerce
          PW_JUNIT_REPORT_PATH: test-results/ecommerce-junit.xml
          PW_JSON_REPORT_PATH: test-results/ecommerce-results.json
        run: npx playwright test --project=ecommerce-chromium --project=ecommerce-api --grep @smoke
      - name: Run full ecommerce tests on confirmed isolated staging
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED == 'true' }}
        env:
          ECOMMERCE_BASE_URL: ${{ vars.ECOMMERCE_BASE_URL }}
          ECOMMERCE_STAGING_CONFIRMED: ${{ vars.ECOMMERCE_STAGING_CONFIRMED }}
          ECOMMERCE_TEST_USER_EMAIL: ${{ secrets.ECOMMERCE_TEST_USER_EMAIL }}
          ECOMMERCE_TEST_USER_PASSWORD: ${{ secrets.ECOMMERCE_TEST_USER_PASSWORD }}
          PW_OUTPUT_DIR: test-results/ecommerce
          PW_HTML_REPORT_DIR: playwright-report/ecommerce
          PW_JUNIT_REPORT_PATH: test-results/ecommerce-junit.xml
          PW_JSON_REPORT_PATH: test-results/ecommerce-results.json
        run: |
          node scripts/verify-ecommerce-staging.js
          npx playwright test --project=ecommerce-chromium --project=ecommerce-api
      - name: Run Zeouf browser fixture regressions
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' }}
        env:
          ECOMMERCE_BASE_URL: ${{ vars.ECOMMERCE_BASE_URL }}
          PW_OUTPUT_DIR: test-results/ecommerce-fixtures
          PW_HTML_REPORT_DIR: playwright-report/ecommerce-fixtures
          PW_JUNIT_REPORT_PATH: test-results/ecommerce-fixtures-junit.xml
          PW_JSON_REPORT_PATH: test-results/ecommerce-fixture-results.json
        run: npm run test:ecommerce:fixtures
      - name: Summarize Zeouf browser fixture results
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' }}
        run: npm run summarize:results -- test-results/ecommerce-fixture-results.json
      - name: Run Zeouf navigation regressions
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' }}
        env:
          ECOMMERCE_BASE_URL: ${{ vars.ECOMMERCE_BASE_URL }}
          PW_OUTPUT_DIR: test-results/ecommerce-navigation
          PW_HTML_REPORT_DIR: playwright-report/ecommerce-navigation
          PW_JUNIT_REPORT_PATH: test-results/ecommerce-navigation-junit.xml
          PW_JSON_REPORT_PATH: test-results/ecommerce-navigation-results.json
        run: npm run test:ecommerce:navigation
      - name: Run Zeouf case monitoring pilot
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' }}
        env:
          ECOMMERCE_BASE_URL: ${{ vars.ECOMMERCE_BASE_URL }}
          ECOMMERCE_BUILD_REVISION: ${{ vars.ECOMMERCE_BUILD_REVISION }}
          PW_OUTPUT_DIR: test-results/ecommerce-pilot
          PW_HTML_REPORT_DIR: playwright-report/ecommerce-pilot
          PW_JUNIT_REPORT_PATH: test-results/ecommerce-pilot-junit.xml
          PW_JSON_REPORT_PATH: test-results/ecommerce-pilot-results.json
        run: npm run test:ecommerce:monitoring-pilot
      - name: Summarize Zeouf navigation results
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' }}
        run: npm run summarize:results -- test-results/ecommerce-navigation-results.json
      - name: Summarize ecommerce test stability
        if: always()
        run: npm run summarize:results -- test-results/ecommerce-results.json
      - name: Build Zeouf case execution evidence
        if: always()
        env:
          ECOMMERCE_STAGING_CONFIRMED: ${{ vars.ECOMMERCE_STAGING_CONFIRMED }}
        run: |
          if [ "$ECOMMERCE_STAGING_CONFIRMED" = "true" ]; then
            npm run monitor:ecommerce -- test-results/ecommerce-results.json
          else
            npm run monitor:ecommerce -- test-results/ecommerce-results.json test-results/ecommerce-fixture-results.json test-results/ecommerce-navigation-results.json test-results/ecommerce-pilot-results.json
          fi
      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ]; then
            npm run allure:generate
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: allure-report
          path: |
            allure-report/
            allure-results/
          retention-days: 30
