name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      pin_deployment:
        description: Run against a publicly accessible immutable Zeouf deployment for a repair pilot
        type: boolean
        default: false
jobs:
  test:
    env:
      ECOMMERCE_BUILD_REVISION: ${{ vars.ECOMMERCE_BUILD_REVISION }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Validate Zeouf individual check mappings
        run: |
          npm run cases:zeouf:mappings
          npm run test:mappings
      - name: Run demo UI and API tests
        env:
          PW_OUTPUT_DIR: test-results/demo
          PW_HTML_REPORT_DIR: playwright-report/demo
          PW_JUNIT_REPORT_PATH: test-results/demo-junit.xml
          PW_JSON_REPORT_PATH: test-results/demo-results.json
        run: npx playwright test --project=api --project=chromium --project=firefox --project=webkit
      - name: Summarize demo test stability
        if: always()
        run: npm run summarize:results -- test-results/demo-results.json
      - name: Record the exact successful Zeouf production deployment
        id: deployment
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' && (inputs.pin_deployment == true || vars.ECOMMERCE_PIN_DEPLOYMENT == 'true') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ecommerce-repair/deployment.js capture test-results/website-deployment.json
      - name: Run deployed Zeouf read-only smoke checks
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' && ((inputs.pin_deployment != true && vars.ECOMMERCE_PIN_DEPLOYMENT != 'true') || steps.deployment.outcome == 'success') }}
        env:
          ECOMMERCE_BASE_URL: ${{ steps.deployment.outputs.url || vars.ECOMMERCE_BASE_URL }}
          ECOMMERCE_BUILD_REVISION: ${{ steps.deployment.outputs.website_revision }}
          ECOMMERCE_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          ECOMMERCE_DEPLOYMENT_FILE: ${{ steps.deployment.outputs.record_file }}
          PW_OUTPUT_DIR: test-results/ecommerce
          PW_HTML_REPORT_DIR: playwright-report/ecommerce
          PW_JUNIT_REPORT_PATH: test-results/ecommerce-junit.xml
          PW_JSON_REPORT_PATH: test-results/ecommerce-results.json
        run: npx playwright test --project=ecommerce-api --grep @smoke
      - name: Run full ecommerce tests on confirmed isolated staging
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED == 'true' }}
        env:
          ECOMMERCE_BASE_URL: ${{ vars.ECOMMERCE_BASE_URL }}
          ECOMMERCE_STAGING_CONFIRMED: ${{ vars.ECOMMERCE_STAGING_CONFIRMED }}
          ECOMMERCE_TEST_USER_EMAIL: ${{ secrets.ECOMMERCE_TEST_USER_EMAIL }}
          ECOMMERCE_TEST_USER_PASSWORD: ${{ secrets.ECOMMERCE_TEST_USER_PASSWORD }}
          PW_OUTPUT_DIR: test-results/ecommerce
          PW_HTML_REPORT_DIR: playwright-report/ecommerce
          PW_JUNIT_REPORT_PATH: test-results/ecommerce-junit.xml
          PW_JSON_REPORT_PATH: test-results/ecommerce-results.json
        run: |
          node scripts/verify-ecommerce-staging.js
          npx playwright test --project=ecommerce-chromium --project=ecommerce-api
      - name: Run expanded Zeouf read-only browser regressions
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' && ((inputs.pin_deployment != true && vars.ECOMMERCE_PIN_DEPLOYMENT != 'true') || steps.deployment.outcome == 'success') }}
        env:
          ECOMMERCE_BASE_URL: ${{ steps.deployment.outputs.url || vars.ECOMMERCE_BASE_URL }}
          ECOMMERCE_BUILD_REVISION: ${{ steps.deployment.outputs.website_revision }}
          ECOMMERCE_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          ECOMMERCE_DEPLOYMENT_FILE: ${{ steps.deployment.outputs.record_file }}
          PW_OUTPUT_DIR: test-results/ecommerce-read-only
          PW_HTML_REPORT_DIR: playwright-report/ecommerce-read-only
          PW_JUNIT_REPORT_PATH: test-results/ecommerce-read-only-junit.xml
          PW_JSON_REPORT_PATH: test-results/ecommerce-read-only-results.json
        run: npm run test:ecommerce:read-only
      - name: Summarize Zeouf read-only browser results
        if: ${{ always() && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' }}
        run: npm run summarize:results -- test-results/ecommerce-read-only-results.json
      - name: Summarize ecommerce test stability
        if: always()
        run: npm run summarize:results -- test-results/ecommerce-results.json
      - name: Checkout pinned Zeouf source for browser-only fixtures
        if: always()
        uses: actions/checkout@v4
        with:
          repository: varunsidr/Luxury_fashion_ecommerce
          ref: 843646b7d0c52ef5149f7905b19ec5d87fe5054b
          path: website-source
          persist-credentials: false
      - name: Run isolated Zeouf browser contracts with placeholder services
        if: always()
        run: npm run test:ecommerce:isolated -- website-source test-results/ecommerce-isolated
      - name: Build Zeouf case execution evidence
        if: always()
        env:
          ECOMMERCE_STAGING_CONFIRMED: ${{ vars.ECOMMERCE_STAGING_CONFIRMED }}
        run: |
          if [ "$ECOMMERCE_STAGING_CONFIRMED" = "true" ]; then
            npm run monitor:ecommerce -- test-results/ecommerce-results.json test-results/ecommerce-isolated/results.json
          else
            npm run monitor:ecommerce -- test-results/ecommerce-results.json test-results/ecommerce-read-only-results.json test-results/ecommerce-isolated/results.json
          fi
      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ]; then
            npm run allure:generate
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: allure-report
          path: |
            allure-report/
            allure-results/
          retention-days: 30
