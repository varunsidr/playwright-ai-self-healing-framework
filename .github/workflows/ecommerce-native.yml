name: Zeouf Native Repository Checks

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  native-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Install browser system dependencies
        run: npx playwright install-deps chromium
      - name: Read the reviewed project revision
        id: project
        run: node scripts/ecommerce-project.js
      - name: Checkout reviewed website source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.project.outputs.website_repository }}
          ref: ${{ steps.project.outputs.website_revision }}
          path: website-source
          persist-credentials: false
      - name: Run native documentation SQL and browser checks
        run: npm run test:ecommerce:native -- website-source test-results/ecommerce-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeouf-native-evidence
          path: test-results/ecommerce-native/
          if-no-files-found: warn
          retention-days: 30
