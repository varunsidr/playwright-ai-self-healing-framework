name: Zeouf controlled repair rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ECOMMERCE_BASE_URL: ${{ vars.ECOMMERCE_BASE_URL }}
      ECOMMERCE_BUILD_REVISION: ${{ vars.ECOMMERCE_BUILD_REVISION }}
      ECOMMERCE_STAGING_CONFIRMED: ${{ vars.ECOMMERCE_STAGING_CONFIRMED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check framework and evaluation rules
        run: npm run check
      - name: Run controlled Zeouf repair rehearsal
        run: npm run demo:ecommerce:repair
      - name: Retain raw failures, proposal and evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeouf-repair-evaluation
          path: test-results/ecommerce-repair-evaluation/
          retention-days: 30
