name: Zeouf Performance Baseline

on:
  workflow_dispatch: {}

jobs:
  browser-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ECOMMERCE_BASE_URL: ${{ vars.ECOMMERCE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Collect shopper experience baseline
        run: npm run perf:ecommerce:baseline
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeouf-browser-performance
          path: test-results/ecommerce-browser-metrics.json
          if-no-files-found: warn
          retention-days: 30
