name: Zeouf CI observation evidence

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed first-attempt pinned Playwright Tests run at this default-branch revision
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: zeouf-observation-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Freeze trusted observation inputs
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Validate trusted first-attempt source run
        id: origin
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN: ${{ inputs.run_id }}
        with:
          script: |
            const fs = require('node:fs');
            const directory = 'test-results/ecommerce-observation-input';
            fs.mkdirSync(directory, { recursive: true });
            if (!/^\d+$/.test(process.env.REQUESTED_RUN) || !Number.isSafeInteger(Number(process.env.REQUESTED_RUN)) || Number(process.env.REQUESTED_RUN) <= 0) throw new Error('Invalid source run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(process.env.REQUESTED_RUN) });
            const { validateSourceRun } = require('./scripts/ecommerce-repair/observation-github');
            const source = validateSourceRun(run, `${context.repo.owner}/${context.repo.repo}`, context.payload.repository.default_branch, context.sha);
            fs.writeFileSync(`${directory}/source-run.json`, JSON.stringify(source, null, 2) + '\n');
            core.setOutput('run_id', source.runId);
      - uses: actions/download-artifact@v4
        with:
          name: playwright-test-results
          run-id: ${{ steps.origin.outputs.run_id }}
          github-token: ${{ github.token }}
          path: test-results/ecommerce-observation-input/original
      - name: Validate recorded immutable deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ecommerce-repair/deployment.js check test-results/ecommerce-observation-input/original/ecommerce-read-only-results.json test-results/ecommerce-observation-input/original/website-deployment.json
      - name: Explain local subscription handoff
        if: always()
        run: |
          echo 'Download zeouf-observation-input. Diagnose and verify locally with observe:ecommerce:local using a ChatGPT login. No model runs in this workflow. Missing or invalid deployment evidence blocks the local pilot.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain original observation inputs even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeouf-observation-input
          path: test-results/ecommerce-observation-input/
          retention-days: 30
