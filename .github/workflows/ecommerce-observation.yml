name: Zeouf CI observation pilot

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed first-attempt pinned Playwright Tests run at this default-branch revision
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: zeouf-observation-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe failure
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ECOMMERCE_STAGING_CONFIRMED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_patch: ${{ steps.capture.outputs.has_patch }}
      framework_revision: ${{ steps.prepare.outputs.framework_revision }}
      website_revision: ${{ steps.prepare.outputs.website_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Validate trusted first-attempt source run
        id: origin
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN: ${{ inputs.run_id }}
        with:
          script: |
            const fs = require('node:fs');
            const directory = 'test-results/ecommerce-observation';
            fs.mkdirSync(directory, { recursive: true });
            if (!/^\d+$/.test(process.env.REQUESTED_RUN) || !Number.isSafeInteger(Number(process.env.REQUESTED_RUN)) || Number(process.env.REQUESTED_RUN) <= 0) throw new Error('Invalid source run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(process.env.REQUESTED_RUN) });
            const { validateSourceRun } = require('./scripts/ecommerce-repair/observation-github');
            const source = validateSourceRun(run, `${context.repo.owner}/${context.repo.repo}`, context.payload.repository.default_branch, context.sha);
            fs.writeFileSync(`${directory}/source-run.json`, JSON.stringify(source, null, 2) + '\n');
            core.setOutput('run_id', source.runId);
      - uses: actions/download-artifact@v4
        with:
          name: playwright-test-results
          run-id: ${{ steps.origin.outputs.run_id }}
          github-token: ${{ github.token }}
          path: test-results/ecommerce-observation/original
      - name: Validate recorded immutable deployment
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ecommerce-repair/deployment.js check test-results/ecommerce-observation/original/ecommerce-read-only-results.json test-results/ecommerce-observation/original/website-deployment.json
      - uses: actions/checkout@v4
        with:
          repository: varunsidr/Luxury_fashion_ecommerce
          ref: ${{ steps.deployment.outputs.website_revision }}
          path: website-source
          persist-credentials: false
      - name: Prepare frozen evidence and isolated checkouts
        id: prepare
        run: npm run repair:ecommerce:ci -- prepare test-results/ecommerce-observation website-source test-results/ecommerce-observation/original/ecommerce-read-only-results.json test-results/ecommerce-observation/original/website-deployment.json
      - name: Diagnose recorded failure
        if: steps.prepare.outputs.active == 'true'
        uses: openai/codex-action@a8d8be6ee028bea4525bc722d16f36687b408c81
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          codex-args: '["--json", "--ephemeral", "-c", "mcp_servers.playwright-test.enabled=false"]'
          working-directory: ${{ steps.prepare.outputs.framework }}
          prompt-file: ${{ github.workspace }}/test-results/ecommerce-observation/diagnosis-prompt.txt
          output-schema-file: ${{ github.workspace }}/test-results/ecommerce-observation/diagnosis.schema.json
          output-file: ${{ github.workspace }}/test-results/ecommerce-observation/diagnosis.json
      - name: Ground diagnosis and route responsibility
        if: steps.prepare.outputs.active == 'true'
        id: route
        run: npm run repair:ecommerce:ci -- route test-results/ecommerce-observation
      - name: Propose isolated repair
        if: ${{ steps.route.outputs.role == 'framework' || steps.route.outputs.role == 'website' }}
        uses: openai/codex-action@a8d8be6ee028bea4525bc722d16f36687b408c81
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          codex-args: '["--json", "--ephemeral", "-c", "mcp_servers.playwright-test.enabled=false"]'
          working-directory: ${{ steps.route.outputs.target }}
          prompt-file: ${{ github.workspace }}/test-results/ecommerce-observation/repair-prompt.txt
          output-schema-file: ${{ github.workspace }}/scripts/ecommerce-repair/repair-result.schema.json
          output-file: ${{ github.workspace }}/test-results/ecommerce-observation/repair.json
      - name: Capture guarded proposal
        if: ${{ steps.route.outputs.role == 'framework' || steps.route.outputs.role == 'website' }}
        id: capture
        run: npm run repair:ecommerce:ci -- capture test-results/ecommerce-observation
      - name: Retain observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeouf-observation-proposal
          path: test-results/ecommerce-observation/
          retention-days: 30

  verify:
    name: Verify isolated proposal
    needs: observe
    if: ${{ needs.observe.result == 'success' && needs.observe.outputs.has_patch == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.observe.outputs.framework_revision }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: varunsidr/Luxury_fashion_ecommerce
          ref: ${{ needs.observe.outputs.website_revision }}
          path: website-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: zeouf-observation-proposal
          path: test-results/ecommerce-observation
      - name: Reproduce original failure and verify unchanged regressions
        run: npm run repair:ecommerce:ci -- verify test-results/ecommerce-observation website-source
      - name: Retain independent verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeouf-observation-verification
          path: test-results/ecommerce-observation/
          retention-days: 30

  report:
    name: Publish observation report
    needs: [observe, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Download observation evidence when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: zeouf-observation-proposal
          path: test-results/ecommerce-observation
      - name: Download verification evidence when available
        if: needs.verify.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: zeouf-observation-verification
          path: test-results/ecommerce-observation
      - name: Collect completed job timing and Codex usage events
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { collectGithubEvidence } = require('./scripts/ecommerce-repair/observation-github');
            await collectGithubEvidence(github, context, 'test-results/ecommerce-observation');
      - name: Build reviewable observation report
        if: always()
        run: npm run observe:ecommerce -- report test-results/ecommerce-observation
      - name: Retain final report and review template
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeouf-observation-report
          path: test-results/ecommerce-observation/
          retention-days: 30
